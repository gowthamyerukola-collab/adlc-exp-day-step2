properties:
  template:
    containers:
      - name: frontend
        image: ${FRONTEND_IMAGE}
        resources:
          cpu: 0.5
          memory: 1Gi
        ports:
          - port: 80
            protocol: TCP
        env:
          - name: VITE_API_URL
            value: ""

      - name: backend
        image: ${BACKEND_IMAGE}
        resources:
          cpu: 0.5
          memory: 1Gi
        ports:
          - port: 3000
            protocol: TCP
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://+:3000"
          - name: LOG_ANALYTICS_WORKSPACE_ID
            value: "${LOG_ANALYTICS_WORKSPACE_ID}"
          - name: LOG_ANALYTICS_TABLE
            value: "ContainerAppConsoleLogs_CL"
          - name: AZURE_MANAGED_IDENTITY_CLIENT_ID
            value: "${AZURE_MANAGED_IDENTITY_CLIENT_ID}"
    scale:
      minReplicas: 1
      maxReplicas: 3
    ingress:
      external: true
      targetPort: 80
      transport: http
