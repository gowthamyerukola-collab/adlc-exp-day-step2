properties:
  template:
    containers:
      - name: frontend
        image: ${FRONTEND_IMAGE}
        resources:
          cpu: 0.5
          memory: 1Gi
        ports:
          - port: 80
            protocol: TCP
        env:
          - name: VITE_API_URL
            value: ""

      - name: backend
        image: ${BACKEND_IMAGE}
        resources:
          cpu: 0.5
          memory: 1Gi
        ports:
          - port: 3000
            protocol: TCP
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://+:3000"
          - name: CURRENCY_API_BASE_URL
            value: "https://api.frankfurter.app"
          - name: COSMOS_DB_URI
            value: "${COSMOS_DB_URI}"
          - name: COSMOS_DB_DATABASE
            value: "currency-conversion-db"
          - name: COSMOS_DB_CONTAINER
            value: "currencyconversion"
          - name: COSMOS_DB_ACCOUNT_NAME
            value: "${COSMOS_DB_ACCOUNT_NAME}"
          - name: COSMOS_DB_RESOURCE_GROUP
            value: "${COSMOS_DB_RESOURCE_GROUP}"
          - name: COSMOS_DB_REGION
            value: "${COSMOS_DB_REGION}"
          - name: AZURE_MANAGED_IDENTITY_CLIENT_ID
            value: "${AZURE_MANAGED_IDENTITY_CLIENT_ID}"
    scale:
      minReplicas: 1
      maxReplicas: 3
    ingress:
      external: true
      targetPort: 80
      transport: http
