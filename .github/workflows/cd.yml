name: Deploy Multi-Container App

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
  workflow_dispatch:

jobs:
  deploy:
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}/frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.repo }}/frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}/backend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.repo }}/backend:latest

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >
            {
              "clientId": "${{ vars.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "tenantId": "${{ vars.TENANT_ID }}",
              "subscriptionId": "${{ vars.SUBSCRIPTION_ID }}"
            }

      - name: Resolve managed identity client ID
        id: mi
        run: |
          MI_CLIENT_ID=$(az identity show \
            --name "id-${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCEGROUP_NAME }}" \
            --query "clientId" -o tsv)
          echo "Resolved managed identity client ID: $MI_CLIENT_ID"
          echo "client_id=$MI_CLIENT_ID" >> "$GITHUB_OUTPUT"

      - name: Substitute template tokens
        run: |
          export FRONTEND_IMAGE="ghcr.io/${{ steps.repo.outputs.repo }}/frontend:${{ github.sha }}"
          export BACKEND_IMAGE="ghcr.io/${{ steps.repo.outputs.repo }}/backend:${{ github.sha }}"
          export COSMOS_DB_URI="https://${{ vars.COSMOSDB_NAME }}.documents.azure.com:443/"
          export COSMOS_DB_ACCOUNT_NAME="${{ vars.COSMOSDB_NAME }}"
          export COSMOS_DB_RESOURCE_GROUP="${{ vars.RESOURCEGROUP_NAME }}"
          export COSMOS_DB_REGION="${{ vars.COSMOS_DB_REGION }}"
          export AZURE_MANAGED_IDENTITY_CLIENT_ID="${{ steps.mi.outputs.client_id }}"
          envsubst < .azure/container-app.tmpl.yaml > .azure/container-app.resolved.yaml

      - name: Ensure Container App registry auth
        run: |
          az containerapp registry set \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCEGROUP_NAME }}" \
            --server ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GHCR_PAT }}"

      - name: Deploy to Azure Container App
        run: |
          sleep 5
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCEGROUP_NAME }}" \
            --yaml .azure/container-app.resolved.yaml

      - name: Print Container App URL
        run: |
          APP_URL=$(az containerapp show \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.RESOURCEGROUP_NAME }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>&1)
          echo "Fetched URL: $APP_URL"
          echo "## Container App URL" >> $GITHUB_STEP_SUMMARY
          echo "http://$APP_URL" >> $GITHUB_STEP_SUMMARY
